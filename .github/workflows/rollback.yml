name: Rollback

# Manual rollback of production (phase OPS, step 5).
#
# Actions, Rollback, Run workflow. Leave version_id empty to restore the most
# recent healthy version before the live one, or paste a Worker version id
# (wrangler versions list, or the Deployments page on GitHub).
#
#   founder approves (environment "production")
#     -> validate: the id exists for worker celpare, is not the live one, and
#        has a GitHub Deployment that reached success and never failed
#     -> wrangler rollback <id>        (once, never in a loop)
#     -> scripts/smoke.mjs <site> <that version's own commit>
#     -> record a Deployment for it (success or failure), and mark the
#        version rolled away from as failed, so neither an automatic nor a
#        manual rollback picks it again until it is redeployed
#
# A rollback restores CODE only. Worker secrets keep their current values, and
# the database is untouched (migrations are additive by rule, so the older
# code still runs on the newer schema). Cloudflare refuses a rollback across a
# change of bindings (wrangler.jsonc); the step then fails with its message and
# nothing changes. Routes are not part of a version, so celpare.com stays bound.

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Worker version id to restore. Empty: the last healthy version before the live one."
        required: false
        default: ""
      reason:
        description: "Why you are rolling back. Goes into the Worker message and the deployment record."
        required: true
      dry_run:
        description: "Only check and report which version would be restored. Changes nothing."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    # Same group as deploy.yml: a rollback never runs during a deploy.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inputs reach the shell through env only, never inside the script text,
      # so a crafted value cannot run as a command.
      INPUT_ID: ${{ inputs.version_id }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      # wrangler is a pinned devDependency; nothing is built.
      - name: Install dependencies
        run: npm ci

      - name: Choose and check the version to restore
        id: target
        run: |
          set -euo pipefail
          reason=$(printf '%s' "$REASON" | tr -d '\r\n' | cut -c1-200)
          if [ "${#reason}" -lt 3 ]; then
            echo "::error::Give a reason of at least 3 characters."; exit 1
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          npx wrangler deployments status --json > "$RUNNER_TEMP/status.json"
          npx wrangler versions list --json > "$RUNNER_TEMP/versions.json"
          current=$(node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const v = [...(s.versions ?? [])].sort((a, b) => b.percentage - a.percentage)[0];
            if (!v) process.exit(1);
            console.log(v.version_id);
          ' "$RUNNER_TEMP/status.json")
          echo "current=$current" >> "$GITHUB_OUTPUT"

          # Healthy versions, newest record first: a deployment written by
          # deploy.yml or this workflow (it carries worker_version_id) that
          # reached success and never failed. "id sha" per line.
          : > "$RUNNER_TEMP/healthy.txt"
          for dep in $(gh api "repos/$GH_REPO/deployments?environment=production&per_page=100" \
                         --jq '.[] | select(.payload.worker_version_id != null) | .id'); do
            state=$(gh api "repos/$GH_REPO/deployments/$dep/statuses?per_page=100" \
                      --jq 'if any(.[]; .state == "failure" or .state == "error") then "bad"
                            elif any(.[]; .state == "success") then "ok" else "none" end')
            if [ "$state" = "ok" ]; then
              gh api "repos/$GH_REPO/deployments/$dep" --jq '"\(.payload.worker_version_id) \(.sha)"' >> "$RUNNER_TEMP/healthy.txt"
            fi
          done

          if [ -z "$INPUT_ID" ]; then
            line=$(grep -v "^$current " "$RUNNER_TEMP/healthy.txt" | head -n1 || true)
            if [ -z "$line" ]; then
              echo "::error::No healthy version other than the live one is recorded. Nothing to roll back to."; exit 1
            fi
          else
            if ! printf '%s' "$INPUT_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
              echo "::error::version_id is not a Worker version id."; exit 1
            fi
            if [ "$INPUT_ID" = "$current" ]; then
              echo "::error::That version is already live."; exit 1
            fi
            line=$(grep "^$INPUT_ID " "$RUNNER_TEMP/healthy.txt" | head -n1 || true)
            if [ -z "$line" ]; then
              echo "::error::That version has no successful deployment on record, so it is not a safe target."; exit 1
            fi
          fi
          id=${line%% *}
          sha=${line##* }

          node -e '
            const list = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const v = list.find((x) => x.id === process.argv[2]);
            if (!v) { console.error("not in wrangler versions list"); process.exit(1); }
            console.log(`version=${(v.annotations?.["workers/message"] ?? "").replace(/^v/, "").split("+")[0] || "unknown"}`);
          ' "$RUNNER_TEMP/versions.json" "$id" >> "$GITHUB_OUTPUT" || {
            echo "::error::Version $id is no longer kept by Cloudflare (it keeps the last 100)."; exit 1; }

          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "Live now: $current"
            echo "Restoring: $id (commit ${sha:0:7})"
            echo "Reason: $reason"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dry run, nothing changed
        if: inputs.dry_run
        run: echo "Dry run. Checks passed; the version above would be restored. Nothing was changed." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Roll back
        id: rb
        if: ${{ !inputs.dry_run }}
        env:
          ID: ${{ steps.target.outputs.id }}
          MSG: ${{ steps.target.outputs.reason }}
        run: |
          npx wrangler rollback "$ID" --message "Manual rollback, $MSG" --yes

      - name: Smoke test the restored version
        id: smoke
        if: steps.rb.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/smoke.mjs "$SITE_URL" "$SHA"

      - name: Record the rollback
        # Only after a rollback that actually happened. If wrangler refused
        # (for example across a binding change), nothing changed and nothing is
        # recorded; the failed step above says why.
        if: always() && steps.rb.outcome == 'success'
        env:
          ID: ${{ steps.target.outputs.id }}
          SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.target.outputs.version }}
          FROM: ${{ steps.target.outputs.current }}
          MSG: ${{ steps.target.outputs.reason }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE" = "success" ]; then state=success; else state=failure; fi
          payload=$(node -e 'console.log(JSON.stringify({
            ref: process.env.SHA, environment: "production", auto_merge: false,
            required_contexts: [], transient_environment: false, production_environment: true,
            description: `Rollback to v${process.env.VERSION}`.slice(0, 140),
            payload: { version: process.env.VERSION, sha: process.env.SHA,
                       worker_version_id: process.env.ID, url: process.env.SITE_URL,
                       timestamp: new Date().toISOString(), rollback: true,
                       rolled_back_from: process.env.FROM, reason: process.env.MSG } }))')
          dep=$(echo "$payload" | gh api "repos/$GH_REPO/deployments" --input - --jq .id)
          gh api "repos/$GH_REPO/deployments/$dep/statuses" -f state="$state" \
            -f environment_url="$SITE_URL" -f description="Manual rollback, smoke $SMOKE" >/dev/null

          # The version rolled away from is no longer a rollback target.
          for old in $(gh api "repos/$GH_REPO/deployments?environment=production&per_page=100" \
                         --jq ".[] | select(.payload.worker_version_id == \"$FROM\") | .id"); do
            gh api "repos/$GH_REPO/deployments/$old/statuses" -f state=failure \
              -f description="Rolled back by hand" >/dev/null
          done

          if [ "$state" = "success" ]; then
            echo "Restored v$VERSION ($ID), smoke test passed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Rolled back to $ID, but its smoke test failed. Check the site now; no further automatic step is taken."
            echo "Rolled back to $ID; smoke test FAILED." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
