name: Rollback

# Manual rollback of production on Vercel (phase OPS step 5, D247, D253).
#
# Actions, Rollback, Run workflow. Leave deployment empty to restore the most
# recent healthy deployment before the live one, or paste a deployment URL
# (https://...vercel.app, from the Deployments page on GitHub or vercel ls).
#
#   founder approves (environment "production")
#     -> validate: the URL is a deployment of this project, is not the one
#        celpare.com serves, and has a GitHub Deployment that reached success
#        and never failed
#     -> vercel rollback <url>        (once, never in a loop)
#     -> scripts/smoke.mjs <site> <that deployment's own commit>
#     -> record a Deployment for it (success or failure), and mark the one
#        rolled away from as failed, so no rollback picks it again until it is
#        redeployed
#
# A rollback restores CODE only. Vercel environment variables keep their current
# values, and the database is untouched (D246: migrations are additive, so the
# older code still runs on the newer schema). On the Hobby plan Vercel may only
# allow rolling back to the previous production deployment; if it refuses, the
# step fails with Vercel's message and nothing changes.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Deployment URL to restore (https://...vercel.app). Empty: the last healthy one before the live one."
        required: false
        default: ""
      reason:
        description: "Why you are rolling back. Goes into the deployment record."
        required: true
      dry_run:
        description: "Only check and report which deployment would be restored. Changes nothing."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    # Same group as deploy.yml: a rollback never runs during a deploy.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Inputs reach the shell through env only, never inside the script text,
      # so a crafted value cannot run as a command.
      INPUT_URL: ${{ inputs.deployment }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # vercel is a pinned devDependency; nothing is built.
      - name: Install dependencies
        run: npm ci

      - name: Choose and check the deployment to restore
        id: target
        run: |
          set -euo pipefail
          reason=$(printf '%s' "$REASON" | tr -d '\r\n' | cut -c1-200)
          if [ "${#reason}" -lt 3 ]; then
            echo "::error::Give a reason of at least 3 characters."; exit 1
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          # Vercel's own answer to "which deployment serves celpare.com".
          # Every caller passes a path ending in "?".
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com${1}teamId=$VERCEL_ORG_ID"; }
          host=${SITE_URL#https://}; host=${host%%/*}
          current_id=$(api "/v4/aliases/$host?" | node -e 'const a=JSON.parse(require("fs").readFileSync(0));console.log(a.deploymentId||a.alias?.deploymentId||"")')
          if [ -z "$current_id" ]; then echo "::error::Could not find the deployment behind $host."; exit 1; fi
          echo "current=$current_id" >> "$GITHUB_OUTPUT"

          # Healthy deployments, newest record first: written by deploy.yml or
          # this workflow (they carry vercel_url), reached success, never failed.
          : > "$RUNNER_TEMP/healthy.txt"
          for dep in $(gh api "repos/$GH_REPO/deployments?environment=production&per_page=100" \
                         --jq '.[] | select(.payload.vercel_url != null) | .id'); do
            state=$(gh api "repos/$GH_REPO/deployments/$dep/statuses?per_page=100" \
                      --jq 'if any(.[]; .state == "failure" or .state == "error") then "bad"
                            elif any(.[]; .state == "success") then "ok" else "none" end')
            if [ "$state" = "ok" ]; then
              gh api "repos/$GH_REPO/deployments/$dep" --jq '"\(.payload.vercel_url) \(.sha) \(.payload.version)"' >> "$RUNNER_TEMP/healthy.txt"
            fi
          done

          # Resolve each candidate URL to its id, to compare with the live one.
          id_of() { api "/v13/deployments/${1#https://}?" | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(d.projectId!==process.env.VERCEL_PROJECT_ID)process.exit(2);console.log(d.id)'; }

          line=""
          if [ -z "$INPUT_URL" ]; then
            while read -r url sha ver; do
              id=$(id_of "$url" || true)
              if [ -n "$id" ] && [ "$id" != "$current_id" ]; then line="$url $sha $ver"; break; fi
            done < "$RUNNER_TEMP/healthy.txt"
            if [ -z "$line" ]; then
              echo "::error::No healthy deployment other than the live one is recorded. Nothing to roll back to."; exit 1
            fi
          else
            if ! printf '%s' "$INPUT_URL" | grep -Eq '^https://[a-z0-9.-]+\.vercel\.app$'; then
              echo "::error::deployment must be a https://...vercel.app deployment URL."; exit 1
            fi
            id=$(id_of "$INPUT_URL" || true)
            if [ -z "$id" ]; then echo "::error::That URL is not a deployment of this project."; exit 1; fi
            if [ "$id" = "$current_id" ]; then echo "::error::That deployment is already live."; exit 1; fi
            line=$(grep "^$INPUT_URL " "$RUNNER_TEMP/healthy.txt" | head -n1 || true)
            if [ -z "$line" ]; then
              echo "::error::That deployment has no successful deploy on record, so it is not a safe target."; exit 1
            fi
          fi
          read -r url sha ver <<< "$line"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          {
            echo "Live now: $current_id"
            echo "Restoring: $url (v$ver, commit ${sha:0:7})"
            echo "Reason: $reason"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dry run, nothing changed
        if: inputs.dry_run
        run: echo "Dry run. Checks passed; the deployment above would be restored. Nothing was changed." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Roll back
        id: rb
        if: ${{ !inputs.dry_run }}
        env:
          URL: ${{ steps.target.outputs.url }}
        run: node scripts/vercel-traffic.mjs rollback "$URL"

      - name: Smoke test the restored deployment
        id: smoke
        if: steps.rb.outcome == 'success'
        continue-on-error: true
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/smoke.mjs "$SITE_URL" "$SHA"

      - name: Record the rollback
        # Only after a rollback that actually happened. If Vercel refused,
        # nothing changed and nothing is recorded; the failed step says why.
        if: always() && steps.rb.outcome == 'success'
        env:
          URL: ${{ steps.target.outputs.url }}
          SHA: ${{ steps.target.outputs.sha }}
          VERSION: ${{ steps.target.outputs.version }}
          FROM: ${{ steps.target.outputs.current }}
          MSG: ${{ steps.target.outputs.reason }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$SMOKE" = "success" ]; then state=success; else state=failure; fi
          payload=$(node -e 'console.log(JSON.stringify({
            ref: process.env.SHA, environment: "production", auto_merge: false,
            required_contexts: [], transient_environment: false, production_environment: true,
            description: `Rollback to v${process.env.VERSION}`.slice(0, 140),
            payload: { version: process.env.VERSION, sha: process.env.SHA,
                       vercel_url: process.env.URL, url: process.env.SITE_URL,
                       timestamp: new Date().toISOString(), rollback: true,
                       rolled_back_from: process.env.FROM, reason: process.env.MSG } }))')
          dep=$(echo "$payload" | gh api "repos/$GH_REPO/deployments" --input - --jq .id)
          gh api "repos/$GH_REPO/deployments/$dep/statuses" -f state="$state" \
            -f environment_url="$SITE_URL" -f description="Manual rollback, smoke $SMOKE" >/dev/null

          # The deployment rolled away from is no longer a rollback target.
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1?teamId=$VERCEL_ORG_ID"; }
          for old in $(gh api "repos/$GH_REPO/deployments?environment=production&per_page=100" \
                         --jq '.[] | select(.payload.vercel_url != null) | "\(.id) \(.payload.vercel_url)"' | tr ' ' '|'); do
            gid=${old%%|*}; ourl=${old#*|}
            oid=$(api "/v13/deployments/${ourl#https://}" | node -e 'try{console.log(JSON.parse(require("fs").readFileSync(0)).id)}catch{}' || true)
            if [ "$oid" = "$FROM" ]; then
              gh api "repos/$GH_REPO/deployments/$gid/statuses" -f state=failure \
                -f description="Rolled back by hand" >/dev/null
            fi
          done

          if [ "$state" = "success" ]; then
            echo "Restored v$VERSION ($URL), smoke test passed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Rolled back to $URL, but its smoke test failed. Check the site now; no further automatic step is taken."
            echo "Rolled back to $URL; smoke test FAILED." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
