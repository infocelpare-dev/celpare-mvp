name: CI

# Every pull request to main and every push to main runs here (phase OPS).
# Five jobs: verify (types, lint), test, security, build, and one summary job
# whose name is the required status check, so branch rules name a single check
# that only passes when everything did.
#
# A note that predates this file's rewrite and still holds: GitHub's default
# code scanning analyses two languages here, javascript-typescript and actions.
# The actions analysis reads workflow files, and with none it fails with the
# repository reporting no code. A workflow directory that is never empty is
# load bearing.
#
# Production deploys (deploy.yml, OPS step 3) start only from a successful run
# of this workflow on main, and ship the Worker artifact this run built, so the
# deployed code is exactly the tested code.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# A newer push to the same PR cancels the older run. Runs on main are never
# cancelled: each one may be the build that goes to production.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig includes next-env.d.ts and .next/types, both generated and
      # gitignored. Without this step tsc fails on "Cannot find name
      # 'PageProps'". typegen makes exactly those types, with no env values.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The 11 suites under Node's own test runner (scripts/test-loader.mjs).
      # Pure modules only: no network, no database, no secrets.
      - name: Run every test suite
        run: npm test

  security:
    name: Secrets, dependencies and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan walks history and the migration check diffs against
          # the base, so both need history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same scan .githooks/pre-commit runs, over all history. Catches a
      # commit made with --no-verify or from a machine without the hook.
      - name: Scan history for secrets
        run: npm run scan:history

      # Production dependencies, high and critical only. Moderate findings are
      # Dependabot's job and do not block a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Applied migrations never change, new ones never destroy data without a
      # written decision. See scripts/check-migrations.mjs.
      - name: Check migrations
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against; nothing to check."
            exit 0
          fi
          git diff --name-status --no-renames "$BASE_SHA" HEAD -- supabase/migrations | npm run -s check:migrations

      # Every commit in the PR and the PR title follow the commit format, so
      # release-please can read them whether the PR is merged or squashed.
      # The title reaches the script through env only, never inside the shell
      # line, so a crafted title cannot run as a command.
      - name: Check commit messages and PR title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git log --format='%an%x1f%B%x1e' "$BASE_SHA..$HEAD_SHA" | node scripts/check-commit-msg.mjs --stdin
          node scripts/check-commit-msg.mjs --title

      # New dependencies with known vulnerabilities or a disallowed licence fail
      # the PR. Needs the dependency graph, on by default for public repos.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build:
    name: Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vercel build reads the project ids from .vercel/project.json. They are
      # identifiers, not credentials: the build runs with no token, and only
      # deploy.yml (after approval) holds VERCEL_TOKEN. Placeholders keep PR
      # builds working before the variables exist.
      - name: Point the build at the Vercel project
        env:
          ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          node -e 'require("fs").writeFileSync(".vercel/project.json", JSON.stringify({
            projectId: process.env.PROJECT_ID || "prj_placeholder",
            orgId: process.env.ORG_ID || "team_placeholder",
            settings: { framework: "nextjs", nodeVersion: "24.x" } }))'

      # The checkout has no .env files (all gitignored), so nothing secret is
      # built in. Only public build values are passed, from repository Actions
      # variables: they ship to every browser by design and are not secrets.
      # Server secrets are Vercel project environment variables, read at
      # runtime (D253).
      - name: Build for Vercel
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Google's own sign in button (src/components/auth/google-button.tsx).
          # Public by design. Unset, the page uses the redirect flow as before.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: npx vercel build --prod --yes

      # No secret shape anywhere in the output, no server key in a function's
      # build time environment, function size under the guard line, and every
      # file a function borrows from the project (filePathMap: .next chunks,
      # node_modules) present, inside the project and never an .env file. See
      # scripts/check-vercel-build.mjs. The borrowed list feeds the pack below.
      - name: Check the Vercel build
        run: npm run -s check:vercel -- --list vercel-files.txt

      # vercel deploy --prebuilt uploads the output AND the borrowed files from
      # the working tree, so both travel together. A tar keeps the function
      # symlinks the output uses (upload-artifact would copy each target).
      - name: Pack the Vercel build with its borrowed files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -cf vercel-bundle.tar .vercel/output -T vercel-files.txt

      # Kept only for main, where deploy.yml picks it up by run id and ships it
      # with vercel deploy --prebuilt, so the deployed code is the tested code
      # (D244). Holds the public build values and the app code, both public.
      - name: Keep the Vercel build for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-${{ github.sha }}
          path: vercel-bundle.tar
          retention-days: 14
          if-no-files-found: error

  ci-ok:
    name: All checks passed
    if: always()
    needs: [verify, test, security, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed."
              exit 1
            fi
          done
