# Dependabot version updates (phase OPS). Security updates are switched on in
# the repository settings and use the same commit prefixes from this file.
#
# Prefixes follow the commit format CI checks (scripts/check-commit-msg.mjs):
# runtime dependencies are fix(deps), so release-please cuts a patch release;
# development dependencies and actions are chore, which releases nothing.
#
# Minor and patch updates are grouped into one PR a week per ecosystem, so the
# queue stays readable. Major updates come one per PR, because each one needs
# reading (Sentry 11 changed what it collects by default).

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    # A dependency goes to the FIRST group it matches, so the lockstep groups
    # come before the broad runtime and dev ones.
    groups:
      # Next, its eslint config and the Cloudflare adapter must move together.
      # The adapter pins a minimum Next (1.20.16 needs next >=16.4.5), and next
      # is a runtime dependency while the other two are dev ones. Split across
      # the runtime and dev groups, neither PR could install on its own (PR #13
      # failed npm ci with ERESOLVE until #12 brought Next 16.4.5). Mixed types
      # take the runtime prefix, fix(deps), which is right for a Next update.
      next-platform:
        patterns: ["next", "eslint-config-next", "@opennextjs/cloudflare"]
        update-types: ["minor", "patch"]
      # Every Remotion package must be on the exact same version, majors too.
      remotion:
        patterns: ["remotion", "@remotion/*"]
      runtime-minor-and-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
      dev-minor-and-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
